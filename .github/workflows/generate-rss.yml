name: Generate RSS feed

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - scripts/generate_feed.py
      - .github/workflows/generate-rss.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate feed
        run: python scripts/generate_feed.py

      - name: Validate feed XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('feed.xml')"

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "feed.xml is already up to date"
            exit 0
          fi
          git commit -m "Update RSS feed"
          git push
